<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano Letters PC — пианино букв</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #05060f;
    --bg2: #0d1225;
    --card: #1a2236;
    --card2: #232d47;
    --border: #2d3a5c;
    --accent: #4ea8ff;
    --accent2: #00e5a0;
    --warn: #ffcc00;
    --danger: #ff4d6d;
    --purple: #c48aff;
    --orange: #ff8a5c;
    --text: #e8eefc;
    --muted: #7c8ab5;
  }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(ellipse at 50% -10%, #1a1f3a 0%, #05060f 60%);
    color: var(--text);
    overflow: hidden;
    user-select: none;
  }
  body { display: flex; justify-content: center; align-items: center; }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, #1a1f3a 0%, #05060f 70%);
    overflow: hidden;
    transition: box-shadow 0.25s;
  }
  #app.flash-good { box-shadow: inset 0 0 220px rgba(0,229,160,0.4); }
  #app.flash-bad  { box-shadow: inset 0 0 220px rgba(255,77,109,0.4); }
  #app.flash-praise { box-shadow: inset 0 0 280px rgba(255,204,0,0.35); }

  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 18px 30px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 30;
    pointer-events: none;
    gap: 12px;
    font-size: 16px;
  }
  .hud-box {
    background: rgba(8, 12, 28, 0.78);
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    font-weight: 700;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hud-box .ico { font-size: 16px; }
  #hudLives { color: var(--danger); letter-spacing: 5px; font-size: 18px; }
  #hudScore { color: var(--accent2); min-width: 110px; justify-content: flex-end; }
  #hudCombo { color: var(--warn); }
  #hudLevel { color: var(--purple); }
  #hudSpeed { color: var(--accent); }
  #hudAcc { color: var(--accent2); }

  #hudLeft, #hudRight { display: flex; gap: 12px; align-items: center; }

  #menuHomeBtn {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(8, 12, 28, 0.78);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.2s;
    z-index: 31;
    pointer-events: auto;
    font-family: inherit;
  }
  #menuHomeBtn:hover {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 20px rgba(78,168,255,0.4);
  }
  #menuHomeBtn:active { transform: translateX(-50%) scale(0.96); }

  #field {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #field::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(90deg,
        transparent 0 79px,
        rgba(78,168,255,0.05) 79px 80px),
      repeating-linear-gradient(0deg,
        transparent 0 79px,
        rgba(78,168,255,0.03) 79px 80px);
    pointer-events: none;
  }

  #dangerLine {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 40px;
    height: 4px;
    background: linear-gradient(90deg,
      transparent, rgba(255,77,109,0.7), rgba(255,77,109,1),
      rgba(255,77,109,0.7), transparent);
    box-shadow: 0 0 30px rgba(255,77,109,0.85);
    z-index: 5;
    pointer-events: none;
  }
  #dangerLine::before {
    content: 'ЛИНИЯ УДАРА';
    position: absolute;
    right: 30px;
    top: -26px;
    color: var(--danger);
    font-size: 12px;
    letter-spacing: 4px;
    font-weight: 800;
    opacity: 0.75;
  }

  .note {
    position: absolute;
    width: 68px;
    height: 68px;
    border-radius: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    font-weight: 900;
    color: #fff;
    font-family: 'Courier New', monospace;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    transform: translate(-50%, -50%);
    will-change: transform, top;
    z-index: 10;
    background: linear-gradient(135deg, #4ea8ff, #2a7bcf);
    border: 2px solid rgba(255,255,255,0.3);
    box-shadow: 0 8px 24px rgba(78,168,255,0.5),
                inset 0 -4px 0 rgba(0,0,0,0.3),
                inset 0 4px 0 rgba(255,255,255,0.2);
  }
  .note.upper {
    background: linear-gradient(135deg, #ff8a5c, #d64a1f);
    box-shadow: 0 8px 24px rgba(255,138,92,0.5),
                inset 0 -4px 0 rgba(0,0,0,0.3),
                inset 0 4px 0 rgba(255,255,255,0.2);
  }
  .note.digit {
    background: linear-gradient(135deg, #ffcc00, #b38f00);
    box-shadow: 0 8px 24px rgba(255,204,0,0.5),
                inset 0 -4px 0 rgba(0,0,0,0.3),
                inset 0 4px 0 rgba(255,255,255,0.2);
    color: #1a1a1a;
  }
  .note.symbol {
    background: linear-gradient(135deg, var(--purple), #7d3ec9);
    box-shadow: 0 8px 24px rgba(196,138,255,0.55),
                inset 0 -4px 0 rgba(0,0,0,0.3),
                inset 0 4px 0 rgba(255,255,255,0.2);
  }
  .note.special {
    animation: specialPulse 0.9s infinite alternate;
  }
  @keyframes specialPulse {
    from { filter: brightness(1) drop-shadow(0 0 0 #ff4d6d); }
    to   { filter: brightness(1.4) drop-shadow(0 0 20px #ff4d6d); }
  }
  .note.hit {
    animation: noteHit 0.32s forwards;
    pointer-events: none;
  }
  @keyframes noteHit {
    0%   { transform: translate(-50%,-50%) scale(1); opacity: 1; filter: brightness(1); }
    35%  { transform: translate(-50%,-50%) scale(1.55); opacity: 0.95;
           filter: brightness(2.6) hue-rotate(100deg); }
    100% { transform: translate(-50%,-50%) scale(0.2); opacity: 0; }
  }

  .float-char {
    position: absolute;
    font-size: 24px;
    font-weight: 900;
    color: var(--accent2);
    pointer-events: none;
    z-index: 26;
    text-shadow: 0 0 14px currentColor;
    animation: floatUp 0.75s forwards;
  }
  @keyframes floatUp {
    from { transform: translate(-50%, 0) scale(1); opacity: 1; }
    to   { transform: translate(-50%, -70px) scale(1.5); opacity: 0; }
  }

  .spark {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 25;
    box-shadow: 0 0 14px currentColor;
  }

  .praise {
    position: absolute;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%) scale(0.3);
    font-size: 66px;
    font-weight: 900;
    letter-spacing: 8px;
    z-index: 28;
    pointer-events: none;
    opacity: 0;
    text-shadow: 0 0 26px currentColor, 0 0 52px currentColor, 0 6px 0 rgba(0,0,0,0.4);
    animation: praisePop 1.1s forwards;
    white-space: nowrap;
  }
  @keyframes praisePop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-10deg); }
    20%  { opacity: 1; transform: translate(-50%, -60%) scale(1.3) rotate(4deg); }
    55%  { opacity: 1; transform: translate(-50%, -95%) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%, -150%) scale(0.85) rotate(-3deg); }
  }

  .error-msg {
    position: absolute;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%) scale(0.3);
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 6px;
    z-index: 29;
    pointer-events: none;
    opacity: 0;
    color: var(--danger);
    text-shadow: 0 0 30px var(--danger), 0 0 60px rgba(255,77,109,0.6), 0 6px 0 rgba(0,0,0,0.4);
    animation: errorPop 1s forwards;
    white-space: nowrap;
  }
  @keyframes errorPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(8deg); }
    15%  { opacity: 1; transform: translate(-50%, -55%) scale(1.25) rotate(-3deg); }
    50%  { opacity: 1; transform: translate(-50%, -70%) scale(1.05) rotate(1deg); }
    100% { opacity: 0; transform: translate(-50%, -120%) scale(0.9) rotate(-2deg); }
  }

  .penalty-msg {
    position: absolute;
    left: 50%;
    top: 60%;
    transform: translate(-50%, -50%) scale(0.3);
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 5px;
    z-index: 29;
    pointer-events: none;
    opacity: 0;
    color: var(--warn);
    text-shadow: 0 0 24px var(--warn), 0 0 48px rgba(255,204,0,0.6), 0 4px 0 rgba(0,0,0,0.4);
    animation: penaltyPop 1.4s forwards;
    white-space: nowrap;
    padding: 10px 26px;
    background: rgba(255,204,0,0.12);
    border: 2px solid var(--warn);
    border-radius: 14px;
    backdrop-filter: blur(6px);
  }
  @keyframes penaltyPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    15%  { opacity: 1; transform: translate(-50%, -55%) scale(1.15); }
    70%  { opacity: 1; transform: translate(-50%, -60%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -90%) scale(0.85); }
  }

  #timingBar {
    position: absolute;
    left: 0; right: 0;
    bottom: 32px;
    height: 8px;
    background: rgba(0,0,0,0.5);
    z-index: 6;
    pointer-events: none;
  }
  #timingFill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--warn), var(--danger));
    width: 0%;
    transition: width 0.08s linear;
    box-shadow: 0 0 14px rgba(255,204,0,0.7);
  }

  #comboBig {
    position: absolute;
    top: 22%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 110px;
    font-weight: 900;
    color: var(--warn);
    text-shadow: 0 0 40px rgba(255,204,0,0.9), 0 0 80px rgba(255,204,0,0.5);
    opacity: 0;
    pointer-events: none;
    z-index: 27;
    transition: opacity 0.2s;
    font-family: 'Courier New', monospace;
    letter-spacing: 6px;
  }
  #comboBig.show {
    opacity: 0.4;
    animation: comboBigPulse 0.4s;
  }
  @keyframes comboBigPulse {
    0% { transform: translateX(-50%) scale(0.7); }
    60% { transform: translateX(-50%) scale(1.15); }
    100% { transform: translateX(-50%) scale(1); }
  }

  #keyHint {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(8,12,28,0.75);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 16px;
    font-size: 12px;
    color: var(--muted);
    z-index: 30;
    pointer-events: none;
    letter-spacing: 0.5px;
  }
  #keyHint b { color: var(--accent); }

  #errorStreak {
    position: absolute;
    top: 78px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 32;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #errorStreak.show { opacity: 1; }
  #errorStreak .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(255,77,109,0.15);
    border: 2px solid rgba(255,77,109,0.4);
    transition: all 0.2s;
  }
  #errorStreak .dot.on {
    background: var(--danger);
    border-color: var(--danger);
    box-shadow: 0 0 14px var(--danger);
    transform: scale(1.2);
  }

  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(4, 6, 16, 0.94);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
    z-index: 100;
    text-align: center;
    overflow-y: auto;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 56px;
    letter-spacing: 10px;
    margin-bottom: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--warn));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 34px rgba(78,168,255,0.5));
    font-weight: 900;
  }
  #overlay p {
    color: #aab4d4;
    font-size: 16px;
    line-height: 1.7;
    margin-bottom: 8px;
    max-width: 680px;
  }
  #overlay .tiny { font-size: 13px; color: var(--muted); }
  #overlay .kbd {
    display: inline-block;
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom-width: 3px;
    border-radius: 6px;
    padding: 3px 10px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: var(--warn);
    margin: 0 3px;
  }

  .diff-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 26px 0 12px;
    width: 100%;
    max-width: 700px;
  }
  .diff-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 20px 14px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .diff-card:hover { transform: translateY(-4px); }
  .diff-card.easy:hover, .diff-card.easy.selected {
    border-color: var(--accent2); box-shadow: 0 8px 32px rgba(0,229,160,0.4);
  }
  .diff-card.medium:hover, .diff-card.medium.selected {
    border-color: var(--warn); box-shadow: 0 8px 32px rgba(255,204,0,0.4);
  }
  .diff-card.hard:hover, .diff-card.hard.selected {
    border-color: var(--danger); box-shadow: 0 8px 32px rgba(255,77,109,0.4);
  }
  .diff-card .ico { font-size: 30px; margin-bottom: 8px; }
  .diff-card h3 { font-size: 18px; letter-spacing: 3px; margin-bottom: 10px; }
  .diff-card.easy h3 { color: var(--accent2); }
  .diff-card.medium h3 { color: var(--warn); }
  .diff-card.hard h3 { color: var(--danger); }
  .diff-card p { font-size: 12px; color: var(--muted); line-height: 1.6; }

  #overlay button {
    margin-top: 26px;
    padding: 18px 56px;
    font-family: inherit;
    font-size: 20px;
    letter-spacing: 5px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #05060f;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  #overlay button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 44px rgba(0,229,160,0.75);
  }
  #overlay button:active { transform: scale(0.98); }

  #finalStats {
    margin: 22px 0;
    font-size: 18px;
    color: var(--warn);
    line-height: 2;
    text-align: left;
    display: inline-block;
    min-width: 360px;
  }
  #finalStats .row { display: flex; justify-content: space-between; gap: 40px; }
  .stat { color: var(--accent2); font-weight: 900; }
  .stat.gold { color: var(--warn); }
  .stat.purple { color: var(--purple); }
  .stat.red { color: var(--danger); }

  #toast {
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(-160px);
    background: var(--card);
    border: 1px solid var(--accent2);
    color: var(--accent2);
    padding: 14px 26px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    z-index: 200;
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    white-space: nowrap;
    box-shadow: 0 10px 34px rgba(0,229,160,0.5);
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div id="hudLeft">
      <div class="hud-box" id="hudLives">❤❤❤❤❤</div>
      <div class="hud-box" id="hudLevel">🟢 ЛЁГКИЙ</div>
      <div class="hud-box" id="hudSpeed">0.47×</div>
    </div>
    <div id="hudRight">
      <div class="hud-box" id="hudCombo">x0</div>
      <div class="hud-box" id="hudAcc">100%</div>
      <div class="hud-box" id="hudScore">0</div>
    </div>
  </div>

  <button id="menuHomeBtn">← В МЕНЮ ИГР</button>

  <div id="errorStreak">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div id="field">
    <div id="comboBig">x0</div>
  </div>

  <div id="timingBar"><div id="timingFill"></div></div>
  <div id="dangerLine"></div>

  <div id="keyHint">печатай на <b>клавиатуре</b> · символы через <b>Shift</b> · <b>Esc</b> — выход</div>

  <div id="toast"></div>

  <div id="overlay"></div>

</div>

<script>
/* =========================================================
   КОНФИГ УРОВНЕЙ
   Интервалы спавна увеличены в 2 раза — нот стало вдвое меньше.
   Скорость и рост оставлены как были (уже уменьшены в 3 раза).
========================================================= */
const LEVELS = {
  easy: {
    name: 'ЛЁГКИЙ',
    icon: '🟢',
    color: '#00e5a0',
    pool: 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ',
    baseSpeed: 0.47,
    speedStep: 0.0004,
    maxSpeed: 1.4,
    // БЫЛО 1300 → 650, СТАЛО 2600 → 1300 (в 2 раза реже)
    spawnStart: 2600,
    spawnMin: 1300,
    lives: 5,
    specialChance: 0.05,
  },
  medium: {
    name: 'СРЕДНИЙ',
    icon: '🟡',
    color: '#ffcc00',
    pool: 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ1234567890',
    baseSpeed: 0.60,
    speedStep: 0.0005,
    maxSpeed: 1.75,
    // БЫЛО 1150 → 520, СТАЛО 2300 → 1040
    spawnStart: 2300,
    spawnMin: 1040,
    lives: 4,
    specialChance: 0.06,
  },
  hard: {
    name: 'СЛОЖНЫЙ',
    icon: '🔴',
    color: '#ff4d6d',
    pool: 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ1234567890' +
          '?!@#$%^&*()-_=+[]{};:\'",.<>/?\\|`~№',
    baseSpeed: 0.73,
    speedStep: 0.0006,
    maxSpeed: 2.1,
    // БЫЛО 950 → 380, СТАЛО 1900 → 760
    spawnStart: 1900,
    spawnMin: 760,
    lives: 3,
    specialChance: 0.08,
  },
};

/* Фразы для ошибок */
const ERROR_PHRASES = [
  'ОШИБКА!',
  'ПРЕКРАТИ!',
  'ПИШИ ПРАВИЛЬНО!',
  'НЕ ТА БУКВА!',
  'ВНИМАТЕЛЬНЕЕ!',
  'МИМО!',
  'НЕВЕРНО!',
];

const PENALTY_PHRASE = 'ШТРАФ −100';

/* =========================================================
   СОСТОЯНИЕ
========================================================= */
let state = {
  level: 'medium',
  running: false,
  lives: 4,
  score: 0,
  combo: 0,
  maxCombo: 0,
  correct: 0,
  wrong: 0,
  notes: [],
  spawnTimer: 0,
  lastFrame: 0,
  gameTime: 0,
  fieldW: 0,
  fieldH: 0,
  hitTimings: [],
  errorStreak: 0,
  penalties: 0,
};

const PRAISE_WORDS = [
  'МОЛОДЕЦ!', 'ОТЛИЧНО!', 'СУПЕР!', 'ВАУ!', 'КЛАСС!',
  'ТАК ДЕРЖАТЬ!', 'КРАСАВА!', 'ИДЕАЛЬНО!', 'ОГОНЬ!', 'ТОП!',
  'ВЕЛИКОЛЕПНО!', 'ПОТРЯСАЮЩЕ!', 'НЕВЕРОЯТНО!', 'МАСТЕР!',
];
const PRAISE_COLORS = ['#00e5a0', '#ffcc00', '#4ea8ff', '#c48aff', '#ff8a5c', '#ff4d6d'];

/* =========================================================
   DOM
========================================================= */
const appEl = document.getElementById('app');
const fieldEl = document.getElementById('field');
const hudLives = document.getElementById('hudLives');
const hudScore = document.getElementById('hudScore');
const hudCombo = document.getElementById('hudCombo');
const hudLevel = document.getElementById('hudLevel');
const hudSpeed = document.getElementById('hudSpeed');
const hudAcc = document.getElementById('hudAcc');
const overlay = document.getElementById('overlay');
const toastEl = document.getElementById('toast');
const comboBig = document.getElementById('comboBig');
const timingFill = document.getElementById('timingFill');
const errorStreakEl = document.getElementById('errorStreak');

/* =========================================================
   ЗВУК
========================================================= */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration = 0.18, type = 'sine', volume = 0.12) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

/* =========================================================
   ГЕНЕРАЦИЯ НОТ
========================================================= */
function randomChar() {
  const cfg = LEVELS[state.level];
  return cfg.pool[Math.floor(Math.random() * cfg.pool.length)];
}

function currentNoteSpeed() {
  const cfg = LEVELS[state.level];
  const raw = cfg.baseSpeed + state.score * cfg.speedStep;
  return Math.min(raw, cfg.maxSpeed);
}

function noteClass(ch) {
  if (ch === ' ') return 'space';
  if (/[!@#$%^&*()_\-=+\[\]{};:'",.<>/?\\|`~№]/.test(ch)) return 'symbol';
  if (/[0-9]/.test(ch)) return 'digit';
  if (/[А-ЯЁA-Z]/.test(ch)) return 'upper';
  return '';
}

function spawnNote() {
  const cfg = LEVELS[state.level];
  const existing = state.notes.map(n => n.ch);
  let ch, tries = 0;
  do {
    ch = randomChar();
    tries++;
  } while (existing.includes(ch) && tries < 25);

  const x = 70 + Math.random() * (state.fieldW - 140);
  const el = document.createElement('div');
  el.className = 'note ' + noteClass(ch);
  const isSpecial = Math.random() < cfg.specialChance;
  if (isSpecial) el.classList.add('special');
  el.textContent = ch;
  el.style.left = x + 'px';
  el.style.top = '-60px';
  fieldEl.appendChild(el);

  const baseSpeed = currentNoteSpeed() * (0.92 + Math.random() * 0.16);
  const speed = isSpecial ? baseSpeed * 1.35 : baseSpeed;

  state.notes.push({
    el, ch,
    x,
    y: -60,
    vy: speed,
    hit: false,
    isSpecial,
  });
}

/* =========================================================
   ВВОД
========================================================= */
document.addEventListener('keydown', (e) => {
  if (!state.running) {
    if (e.key === 'Enter') {
      const btn = overlay.querySelector('#startBtn');
      if (btn) { e.preventDefault(); btn.click(); }
    }
    return;
  }
  if (e.key === 'Escape') { endGame(); return; }
  if (e.key === 'Tab') { e.preventDefault(); return; }
  if (e.key.length !== 1) return;
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  e.preventDefault();
  onInput(e.key);
});

function onInput(rawCh) {
  ensureAudio();

  let ch = rawCh;
  if (/[а-яё]/i.test(ch)) ch = ch.toUpperCase();
  else if (/[a-z]/i.test(ch)) ch = ch.toUpperCase();

  const candidates = state.notes
    .filter(n => !n.hit && n.ch === ch)
    .sort((a, b) => b.y - a.y);

  if (candidates.length === 0) {
    // ОШИБКА — неверная буква
    state.combo = 0;
    state.wrong++;
    state.errorStreak++;

    const phrase = ERROR_PHRASES[Math.floor(Math.random() * ERROR_PHRASES.length)];
    showErrorMessage(phrase);

    if (state.errorStreak >= 3) {
      state.penalties++;
      state.score = Math.max(0, state.score - 100);
      showPenalty();
      playPenaltySound();
      state.errorStreak = 0;
    } else {
      playTone(110, 0.18, 'sawtooth', 0.08);
      playTone(90, 0.22, 'square', 0.06);
    }

    flash('bad');
    updateHUD();
    updateErrorStreak();
    return;
  }

  // УСПЕХ
  state.errorStreak = 0;
  updateErrorStreak();

  const note = candidates[0];
  note.hit = true;
  note.el.classList.add('hit');

  const progress = Math.min(1, note.y / (state.fieldH - 60));
  state.hitTimings.push(progress);

  state.correct++;
  state.combo++;
  if (state.combo > state.maxCombo) state.maxCombo = state.combo;

  const basePts = 10;
  const comboBonus = Math.min(state.combo, 30) * 2;
  const accBonus = Math.round(progress * 20);
  const specialBonus = note.isSpecial ? 50 : 0;
  const total = basePts + comboBonus + accBonus + specialBonus;
  state.score += total;

  const baseFreq = 220 + (ch.charCodeAt(0) % 24) * 28;
  playTone(baseFreq, 0.22, 'triangle', 0.13 + progress * 0.06);
  if (state.combo >= 5) playTone(baseFreq * 1.5, 0.18, 'sine', 0.07);
  if (note.isSpecial) playTone(baseFreq * 2, 0.3, 'square', 0.06);

  flash('good');
  spawnSparks(note.x, note.y, note.isSpecial ? 20 : 12, progress);
  spawnFloatingChar(note.x, note.y, `+${total}`, note.isSpecial ? '#ff4d6d' : '#00e5a0');

  if (state.combo > 0 && state.combo % 5 === 0) {
    showPraise();
  } else if (progress > 0.85 && Math.random() < 0.35) {
    showPraise('ТОЧНО!');
  }

  if (state.combo >= 3) {
    comboBig.textContent = 'x' + state.combo;
    comboBig.classList.remove('show');
    void comboBig.offsetWidth;
    comboBig.classList.add('show');
    clearTimeout(comboBig._t);
    comboBig._t = setTimeout(() => comboBig.classList.remove('show'), 900);
  }

  setTimeout(() => note.el.remove(), 320);
  state.notes = state.notes.filter(n => n !== note);
  updateHUD();
}

/* =========================================================
   СООБЩЕНИЯ
========================================================= */
function showErrorMessage(text) {
  const el = document.createElement('div');
  el.className = 'error-msg';
  el.textContent = text;
  el.style.marginLeft = (Math.random() * 60 - 30) + 'px';
  fieldEl.appendChild(el);
  setTimeout(() => el.remove(), 1050);
}

function showPenalty() {
  const el = document.createElement('div');
  el.className = 'penalty-msg';
  el.textContent = PENALTY_PHRASE;
  fieldEl.appendChild(el);
  setTimeout(() => el.remove(), 1450);

  flash('bad');
  appEl.animate(
    [{ transform: 'translateX(0)' },
     { transform: 'translateX(-12px)' },
     { transform: 'translateX(12px)' },
     { transform: 'translateX(-8px)' },
     { transform: 'translateX(8px)' },
     { transform: 'translateX(0)' }],
    { duration: 320 }
  );
}

function playPenaltySound() {
  playTone(160, 0.15, 'sawtooth', 0.1);
  setTimeout(() => playTone(120, 0.2, 'sawtooth', 0.1), 100);
  setTimeout(() => playTone(90, 0.35, 'square', 0.12), 220);
}

function updateErrorStreak() {
  const dots = errorStreakEl.querySelectorAll('.dot');
  if (state.errorStreak > 0) {
    errorStreakEl.classList.add('show');
    dots.forEach((d, i) => {
      d.classList.toggle('on', i < state.errorStreak);
    });
  } else {
    errorStreakEl.classList.remove('show');
    dots.forEach(d => d.classList.remove('on'));
  }
}

/* =========================================================
   ЭФФЕКТЫ
========================================================= */
function spawnFloatingChar(x, y, txt, color) {
  const el = document.createElement('div');
  el.className = 'float-char';
  el.textContent = txt;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.color = color;
  el.style.textShadow = `0 0 14px ${color}`;
  fieldEl.appendChild(el);
  setTimeout(() => el.remove(), 780);
}

function spawnSparks(x, y, count = 12, accuracy = 0.5) {
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const color = PRAISE_COLORS[Math.floor(Math.random() * PRAISE_COLORS.length)];
    s.style.background = color;
    s.style.color = color;
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    fieldEl.appendChild(s);

    const ang = Math.random() * Math.PI * 2;
    const spd = (80 + Math.random() * 180) * (0.5 + accuracy);
    const vx = Math.cos(ang) * spd;
    const vy = Math.sin(ang) * spd;
    const start = performance.now();
    const life = 450 + Math.random() * 300;
    const sizeStart = 6 + Math.random() * 8 + accuracy * 4;

    function anim(t) {
      const dt = (t - start) / 1000;
      if (dt * 1000 > life) { s.remove(); return; }
      s.style.left = (x + vx * dt) + 'px';
      s.style.top = (y + vy * dt + 120 * dt * dt) + 'px';
      s.style.opacity = 1 - dt * 1000 / life;
      const sz = Math.max(2, sizeStart * (1 - dt * 1000 / life));
      s.style.width = sz + 'px';
      s.style.height = sz + 'px';
      requestAnimationFrame(anim);
    }
    requestAnimationFrame(anim);
  }
}

function showPraise(forcedWord) {
  const word = forcedWord || PRAISE_WORDS[Math.floor(Math.random() * PRAISE_WORDS.length)];
  const color = PRAISE_COLORS[Math.floor(Math.random() * PRAISE_COLORS.length)];
  const el = document.createElement('div');
  el.className = 'praise';
  el.textContent = word;
  el.style.color = color;
  el.style.marginLeft = (Math.random() * 100 - 50) + 'px';
  fieldEl.appendChild(el);
  setTimeout(() => el.remove(), 1150);
  flash('praise');

  playTone(660, 0.1, 'sine', 0.07);
  setTimeout(() => playTone(880, 0.12, 'sine', 0.07), 60);
  setTimeout(() => playTone(1100, 0.15, 'sine', 0.07), 120);
}

function flash(type) {
  const cls = type === 'good' ? 'flash-good' : type === 'bad' ? 'flash-bad' : 'flash-praise';
  appEl.classList.add(cls);
  setTimeout(() => appEl.classList.remove(cls), 260);
}

/* =========================================================
   HUD
========================================================= */
function updateHUD() {
  hudLives.textContent = '❤'.repeat(Math.max(0, state.lives)) + '·'.repeat(Math.max(0, LEVELS[state.level].lives - state.lives));
  hudScore.textContent = state.score.toLocaleString('ru-RU');
  const comboTxt = 'x' + state.combo;
  if (hudCombo.textContent !== comboTxt) {
    hudCombo.textContent = comboTxt;
    hudCombo.animate(
      [{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }],
      { duration: 220 }
    );
  }
  hudLevel.textContent = LEVELS[state.level].icon + ' ' + LEVELS[state.level].name;
  hudLevel.style.color = LEVELS[state.level].color;
  hudSpeed.textContent = currentNoteSpeed().toFixed(2) + '×';
  const total = state.correct + state.wrong;
  const acc = total > 0 ? Math.round(state.correct / total * 100) : 100;
  hudAcc.textContent = acc + '%';
}

/* =========================================================
   ИГРОВОЙ ЦИКЛ
========================================================= */
function loop(ts) {
  if (!state.running) return;
  const dt = Math.min(ts - state.lastFrame, 60);
  state.lastFrame = ts;
  state.gameTime += dt;

  state.fieldW = fieldEl.clientWidth;
  state.fieldH = fieldEl.clientHeight;

  const cfg = LEVELS[state.level];
  state.spawnTimer += dt;
  const progress = Math.min(1, state.score / 800);
  const interval = cfg.spawnStart - (cfg.spawnStart - cfg.spawnMin) * progress;
  if (state.spawnTimer >= interval) {
    state.spawnTimer = 0;
    spawnNote();
  }

  const bottomLine = state.fieldH - 60;

  for (let i = state.notes.length - 1; i >= 0; i--) {
    const n = state.notes[i];
    if (n.hit) continue;
    n.y += n.vy * (dt / 16.67);
    n.el.style.top = n.y + 'px';

    if (n.y >= bottomLine) {
      // НОТА УПАЛА — просто снимаем жизнь, без штрафа
      n.hit = true;
      n.el.remove();
      state.notes = state.notes.filter(x => x !== n);
      state.lives--;
      state.combo = 0;

      flash('bad');
      playTone(90, 0.35, 'sawtooth', 0.13);

      appEl.animate(
        [{ transform: 'translateX(0)' },
         { transform: 'translateX(-7px)' },
         { transform: 'translateX(7px)' },
         { transform: 'translateX(0)' }],
        { duration: 180 }
      );
      updateHUD();
      if (state.lives <= 0) {
        endGame();
        return;
      }
    }
  }

  let maxProg = 0;
  for (const n of state.notes) {
    if (n.hit) continue;
    const p = Math.min(1, n.y / bottomLine);
    if (p > maxProg) maxProg = p;
  }
  timingFill.style.width = (maxProg * 100) + '%';

  updateHUD();
  requestAnimationFrame(loop);
}

/* =========================================================
   СТАРТ / ФИНИШ
========================================================= */
function startGame() {
  state.running = true;
  state.lives = LEVELS[state.level].lives;
  state.score = 0;
  state.combo = 0;
  state.maxCombo = 0;
  state.correct = 0;
  state.wrong = 0;
  state.errorStreak = 0;
  state.penalties = 0;
  state.notes.forEach(n => n.el.remove());
  state.notes = [];
  state.spawnTimer = 0;
  state.gameTime = 0;
  state.hitTimings = [];
  state.lastFrame = performance.now();

  state.fieldW = fieldEl.clientWidth;
  state.fieldH = fieldEl.clientHeight;

  updateErrorStreak();
  overlay.classList.add('hidden');
  updateHUD();
  ensureAudio();
  requestAnimationFrame(loop);
}

function endGame() {
  state.running = false;
  state.notes.forEach(n => n.el.remove());
  state.notes = [];
  timingFill.style.width = '0%';
  errorStreakEl.classList.remove('show');

  const total = state.correct + state.wrong;
  const accuracy = total > 0 ? Math.round(state.correct / total * 100) : 100;
  const minutes = Math.max(state.gameTime / 60000, 0.01);
  const perMin = Math.round(state.correct / minutes);

  const avgHitAcc = state.hitTimings.length
    ? Math.round(state.hitTimings.reduce((a, b) => a + b, 0) / state.hitTimings.length * 100)
    : 0;

  let rank = 'D';
  let rankColor = '#7c8ab5';
  if (state.score > 6000) { rank = 'S'; rankColor = '#ffcc00'; }
  else if (state.score > 3500) { rank = 'A'; rankColor = '#00e5a0'; }
  else if (state.score > 2000) { rank = 'B'; rankColor = '#4ea8ff'; }
  else if (state.score > 900) { rank = 'C'; rankColor = '#c48aff'; }

  overlay.innerHTML = `
    <h1>ИГРА ОКОНЧЕНА</h1>
    <div style="font-size:140px; line-height:1; margin:10px 0;
                color:${rankColor};
                text-shadow: 0 0 44px ${rankColor}, 0 0 88px ${rankColor};
                font-weight:900; letter-spacing:10px;">${rank}</div>
    <div id="finalStats">
      <div class="row"><span>Очки:</span> <span class="stat">${state.score.toLocaleString('ru-RU')}</span></div>
      <div class="row"><span>Верных:</span> <span class="stat">${state.correct} / ${total}</span></div>
      <div class="row"><span>Ошибок:</span> <span class="stat red">${state.wrong}</span></div>
      <div class="row"><span>Штрафов (−100):</span> <span class="stat red">${state.penalties}</span></div>
      <div class="row"><span>Точность:</span> <span class="stat">${accuracy}%</span></div>
      <div class="row"><span>Средняя точность удара:</span> <span class="stat gold">${avgHitAcc}%</span></div>
      <div class="row"><span>Макс. комбо:</span> <span class="stat gold">x${state.maxCombo}</span></div>
      <div class="row"><span>Скорость:</span> <span class="stat purple">${perMin} / мин</span></div>
      <div class="row"><span>Уровень:</span> <span class="stat purple">${LEVELS[state.level].name}</span></div>
    </div>
    <p style="color:#6b7aa5; font-size:14px;">Нажми <span class="kbd">Enter</span> или кнопку ниже</p>
    <button id="startBtn">ЕЩЁ РАЗ</button>
    <button id="menuBtn" style="margin-top:12px; padding:12px 34px; font-size:15px; letter-spacing:3px; background:var(--card); color:var(--text); border:1px solid var(--border);">В МЕНЮ</button>
  `;
  overlay.classList.remove('hidden');

  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('menuBtn').onclick = showMenu;
}

function showMenu() {
  overlay.innerHTML = `
    <h1>PIANO LETTERS</h1>
    <p>Символы летят вниз — нажимай нужную клавишу на <b style="color:var(--accent)">клавиатуре</b>.</p>
    <p>Чем ближе к красной линии ударишь — тем больше очков и ярче эффекты.</p>
    <p class="tiny">
      <span class="kbd">А</span>–<span class="kbd">Я</span> — буквы ·
      <span class="kbd">0</span>–<span class="kbd">9</span> — цифры ·
      <span class="kbd">Shift</span>+клавиша — символы ·
      <span class="kbd">Esc</span> — выйти
    </p>
    <p class="tiny" style="color:var(--danger); margin-top:8px;">
      ⚠ 3 неверных нажатия подряд = штраф −100 очков<br>
      ⚠ Пропущенная нота = минус жизнь (без штрафа)
    </p>
    <p style="margin-top:20px; color:var(--muted);">Выбери уровень:</p>
    <div class="diff-grid">
      <div class="diff-card easy ${state.level === 'easy' ? 'selected' : ''}" data-level="easy">
        <div class="ico">🌱</div>
        <h3>ЛЁГКИЙ</h3>
        <p>Только буквы<br>Очень медленно<br>Нот мало<br>5 жизней</p>
      </div>
      <div class="diff-card medium ${state.level === 'medium' ? 'selected' : ''}" data-level="medium">
        <div class="ico">⚡</div>
        <h3>СРЕДНИЙ</h3>
        <p>Буквы + цифры<br>Медленно<br>Нот мало<br>4 жизни</p>
      </div>
      <div class="diff-card hard ${state.level === 'hard' ? 'selected' : ''}" data-level="hard">
        <div class="ico">🔥</div>
        <h3>СЛОЖНЫЙ</h3>
        <p>+ символы ?!@#{}[]&lt;&gt;<br>Умеренно<br>3 жизни</p>
      </div>
    </div>
    <button id="startBtn">НАЧАТЬ (ENTER)</button>
    <button id="menuBtn" style="margin-top:12px; padding:12px 34px; font-size:15px; letter-spacing:3px; background:var(--card); color:var(--text); border:1px solid var(--border);">← В МЕНЮ ИГР</button>
  `;
  overlay.classList.remove('hidden');

  overlay.querySelectorAll('.diff-card').forEach(card => {
    card.onclick = () => {
      state.level = card.dataset.level;
      overlay.querySelectorAll('.diff-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    };
  });

  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('menuBtn').onclick = goHome;
}

/* =========================================================
   ПЕРЕХОД В МЕНЮ ИГР
========================================================= */
function goHome() {
  window.location.href = 'index.html';
}

document.getElementById('menuHomeBtn').onclick = goHome;

/* =========================================================
   ЗАПУСК
========================================================= */
window.addEventListener('resize', () => {
  state.fieldW = fieldEl.clientWidth;
  state.fieldH = fieldEl.clientHeight;
});

showMenu();
</script>
