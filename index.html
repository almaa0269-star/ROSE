<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой игровой хаб — 3 игры</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #05060f;
    --bg2: #0d1225;
    --card: #1a2236;
    --card2: #232d47;
    --border: #2d3a5c;
    --accent: #4ea8ff;
    --accent2: #00e5a0;
    --warn: #ffcc00;
    --danger: #ff4d6d;
    --purple: #c48aff;
    --orange: #ff8a5c;
    --text: #e8eefc;
    --muted: #7c8ab5;
  }
  html, body {
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(ellipse at 50% -10%, #1a1f3a 0%, #05060f 60%);
    color: var(--text);
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(78,168,255,0.15), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(196,138,255,0.12), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(0,229,160,0.1), transparent 45%);
    z-index: -2;
    pointer-events: none;
    animation: bgPulse 12s ease-in-out infinite alternate;
  }
  @keyframes bgPulse {
    from { opacity: 0.6; }
    to   { opacity: 1; }
  }

  .star {
    position: fixed;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.1; }
    to   { opacity: 0.9; }
  }

  header {
    padding: 60px 20px 30px;
    text-align: center;
    position: relative;
  }
  header h1 {
    font-size: clamp(32px, 6vw, 64px);
    font-weight: 900;
    letter-spacing: clamp(2px, 1vw, 8px);
    margin-bottom: 14px;
    background: linear-gradient(135deg, #4ea8ff 0%, #00e5a0 40%, #ffcc00 70%, #c48aff 100%);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradMove 8s ease infinite;
    filter: drop-shadow(0 0 30px rgba(78,168,255,0.4));
  }
  @keyframes gradMove {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  header p {
    color: var(--muted);
    font-size: clamp(13px, 1.5vw, 17px);
    letter-spacing: 2px;
    max-width: 700px;
    margin: 0 auto;
    line-height: 1.6;
  }
  .stats-top {
    margin-top: 20px;
    display: inline-flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat-pill {
    background: rgba(26, 34, 54, 0.7);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
    backdrop-filter: blur(8px);
  }
  .stat-pill b { color: var(--accent2); }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px 100px;
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 22px;
  }

  .game-card {
    background: linear-gradient(165deg, var(--card), var(--bg2));
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1),
                box-shadow 0.3s,
                border-color 0.3s;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 420px;
    text-decoration: none;
    color: inherit;
  }
  .game-card:hover {
    transform: translateY(-8px);
    border-color: var(--accent);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5),
                0 0 40px rgba(78,168,255,0.25);
  }
  .game-card:active { transform: translateY(-4px); }

  .game-preview {
    height: 180px;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 80px;
    border-bottom: 1px solid var(--border);
  }
  .game-preview::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.5));
    pointer-events: none;
  }

  .preview-astro {
    background:
      radial-gradient(circle at 30% 30%, rgba(78,168,255,0.4), transparent 50%),
      radial-gradient(circle at 70% 60%, rgba(196,138,255,0.3), transparent 45%),
      linear-gradient(180deg, #0d1030, #05060f);
    color: #fff;
  }
  .preview-astro .ship-icon {
    font-size: 90px;
    filter: drop-shadow(0 0 20px #4ea8ff);
    animation: floatShip 3s ease-in-out infinite;
  }
  @keyframes floatShip {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50%     { transform: translateY(-10px) rotate(3deg); }
  }

  .preview-piano-pc {
    background:
      radial-gradient(circle at 20% 30%, rgba(196,138,255,0.3), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(78,168,255,0.3), transparent 40%),
      linear-gradient(180deg, #0d1225, #05060f);
  }
  .preview-piano-pc .letters {
    display: flex;
    gap: 6px;
    font-weight: 900;
    font-size: 32px;
    font-family: 'Courier New', monospace;
  }
  .preview-piano-pc .letters span {
    animation: letterFall 2s linear infinite;
    opacity: 0;
  }
  .preview-piano-pc .letters span:nth-child(1) { color: #4ea8ff; animation-delay: 0s; }
  .preview-piano-pc .letters span:nth-child(2) { color: #ffcc00; animation-delay: 0.4s; }
  .preview-piano-pc .letters span:nth-child(3) { color: #c48aff; animation-delay: 0.8s; }
  .preview-piano-pc .letters span:nth-child(4) { color: #00e5a0; animation-delay: 1.2s; }
  .preview-piano-pc .letters span:nth-child(5) { color: #ff4d6d; animation-delay: 1.6s; }
  @keyframes letterFall {
    0%   { transform: translateY(-80px); opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(80px); opacity: 0; }
  }

  .preview-fruit {
    background:
      radial-gradient(circle at 25% 30%, rgba(255,138,92,0.35), transparent 40%),
      radial-gradient(circle at 75% 60%, rgba(255,77,109,0.3), transparent 40%),
      linear-gradient(180deg, #1c2330, #0d1219);
  }
  .preview-fruit .fruits {
    display: flex;
    gap: 8px;
    font-size: 56px;
  }
  .preview-fruit .fruits span {
    animation: fruitFloat 2.5s ease-in-out infinite;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
  }
  .preview-fruit .fruits span:nth-child(1) { animation-delay: 0s; }
  .preview-fruit .fruits span:nth-child(2) { animation-delay: 0.3s; }
  .preview-fruit .fruits span:nth-child(3) { animation-delay: 0.6s; }
  .preview-fruit .fruits span:nth-child(4) { animation-delay: 0.9s; }
  @keyframes fruitFloat {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50%     { transform: translateY(-12px) rotate(5deg); }
  }

  .game-body {
    padding: 20px 22px 22px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .game-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: 1px;
    color: var(--text);
  }
  .game-desc {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 16px;
    flex: 1;
  }

  .game-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .tag {
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 1px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .tag.keyboard { background: rgba(78,168,255,0.15); color: var(--accent); }
  .tag.action   { background: rgba(255,77,109,0.15); color: var(--danger); }
  .tag.space    { background: rgba(196,138,255,0.15); color: var(--purple); }
  .tag.typing   { background: rgba(0,229,160,0.15); color: var(--accent2); }
  .tag.pc       { background: rgba(255,204,0,0.15); color: var(--warn); }
  .tag.mobile   { background: rgba(255,138,92,0.15); color: var(--orange); }
  .tag.music    { background: rgba(196,138,255,0.15); color: var(--purple); }
  .tag.fruit    { background: rgba(255,138,92,0.15); color: var(--orange); }

  .game-play {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .game-play .arrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #05060f;
    font-size: 18px;
    transition: transform 0.3s;
  }
  .game-card:hover .game-play .arrow {
    transform: translateX(6px);
  }

  .game-number {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 48px;
    font-weight: 900;
    color: rgba(255,255,255,0.06);
    z-index: 2;
    letter-spacing: -2px;
    line-height: 1;
  }

  .badge-new {
    position: absolute;
    top: 14px;
    left: 14px;
    background: linear-gradient(135deg, var(--warn), var(--orange));
    color: #05060f;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1.5px;
    padding: 5px 10px;
    border-radius: 20px;
    z-index: 3;
    box-shadow: 0 4px 12px rgba(255,204,0,0.4);
    animation: badgePulse 2s ease-in-out infinite;
  }
  @keyframes badgePulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.08); }
  }

  footer {
    text-align: center;
    padding: 40px 20px 30px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1.5px;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  footer b { color: var(--accent); }

  @media (max-width: 600px) {
    header { padding: 40px 16px 20px; }
    main { padding: 20px 14px 60px; }
    .games-grid { grid-template-columns: 1fr; gap: 16px; }
    .game-preview { height: 150px; }
    .game-card { min-height: auto; }
    .game-number { font-size: 38px; }
  }
</style>
</head>
<body>

<header>
  <h1>МОЙ ИГРОВОЙ ХАБ</h1>
  <p>Три игры в одном месте. Кликай — и сразу играешь.</p>
  <div class="stats-top">
    <span class="stat-pill">🎮 <b>3</b> игры</span>
    <span class="stat-pill">⌨️ Тренажёры печати</span>
    <span class="stat-pill">🍉 Аркада</span>
  </div>
</header>

<main>
  <div class="games-grid" id="gamesGrid"></div>
</main>

<footer>
  <b>МОЙ ИГРОВОЙ ХАБ</b> · сделано с ❤️ для тренировки клавиатуры и рефлексов
</footer>

<script>
/* ============================================================
   СПИСОК ИГР
   Файл index.html должен лежать в одной папке с играми.
   Если имена файлов отличаются — поменяй поле "file".
============================================================ */
const GAMES = [
  {
    id: 'astro',
    file: 'Космический клаватайпер.html',
    title: 'ASTRO TYPER',
    subtitle: 'Космический клавиатурный тренажёр',
    desc: 'Ты — пилот звёздолёта в астероидном поле. Метеориты со словами летят со всех сторон. Печатай слова, чтобы сбить их лазером. Не успел — минус жизнь.',
    previewClass: 'preview-astro',
    previewHTML: '<div class="ship-icon">🚀</div>',
    tags: [
      { label: 'Клавиатура', cls: 'keyboard' },
      { label: 'Космос', cls: 'space' },
      { label: 'Тренажёр', cls: 'typing' },
    ],
    badge: null,
  },
  {
    id: 'piano-pc',
    file: 'Пианино тайпер.html',
    title: 'PIANO LETTERS PC',
    subtitle: 'Пианино букв — все символы клавиатуры',
    desc: 'Летят буквы, цифры и символы. Печатай на клавиатуре, лови точный момент удара. Похвала «МОЛОДЕЦ!», спец-ноты и оценка в конце от D до S.',
    previewClass: 'preview-piano-pc',
    previewHTML: `<div class="letters">
      <span>А</span><span>3</span><span>@</span><span>Ж</span><span>?</span>
    </div>`,
    tags: [
      { label: 'ПК', cls: 'pc' },
      { label: 'Все символы', cls: 'keyboard' },
      { label: 'Точность', cls: 'action' },
    ],
    badge: 'NEW',
  },
  {
    id: 'fruit',
    file: 'фрукт ниньзя.html',
    title: 'FRUIT NINJA',
    subtitle: 'Аркада — режь фрукты мышью или пальцем',
    desc: 'Классическая аркада: фрукты взлетают вверх, ты режешь их движением. Попадёшь по бомбе — конец игры. Есть обычный режим и 🔥 АД.',
    previewClass: 'preview-fruit',
    previewHTML: `<div class="fruits">
      <span>🍎</span><span>🍊</span><span>🍉</span><span>🍓</span>
    </div>`,
    tags: [
      { label: 'Аркада', cls: 'action' },
      { label: 'Мышь', cls: 'pc' },
      { label: 'Тач', cls: 'mobile' },
    ],
    badge: null,
  },
];

/* ============================================================
   РЕНДЕР КАРТОЧЕК
============================================================ */
const grid = document.getElementById('gamesGrid');

GAMES.forEach((game, index) => {
  const card = document.createElement('div');
  card.className = 'game-card';
  card.innerHTML = `
    <div class="game-number">${String(index + 1).padStart(2, '0')}</div>
    ${game.badge ? `<div class="badge-new">${game.badge}</div>` : ''}
    <div class="game-preview ${game.previewClass}">
      ${game.previewHTML}
    </div>
    <div class="game-body">
      <div class="game-title">${game.title}</div>
      <div class="game-desc">${game.desc}</div>
      <div class="game-tags">
        ${game.tags.map(t => `<span class="tag ${t.cls}">${t.label}</span>`).join('')}
      </div>
      <div class="game-play">
        <span>▶ Играть</span>
        <span class="arrow">→</span>
      </div>
    </div>
  `;
  // КЛИК → сразу запускаем игру в новой вкладке
  card.addEventListener('click', () => {
    const url = encodeURI(game.file);
    window.open(url, '_blank');
  });
  grid.appendChild(card);
});

/* ============================================================
   ЗВЁЗДЫ НА ФОНЕ
============================================================ */
(function createStars() {
  const count = 60;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 2) + 's';
    s.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    document.body.appendChild(s);
  }
})();
</script>

</body>
</html>
