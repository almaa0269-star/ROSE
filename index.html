<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fruit Ninja </title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #10131a;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #gameFrame {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #10131a;
      box-shadow: 0 0 40px rgba(0,0,0,.55);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.07), transparent 30%),
        radial-gradient(circle at 80% 25%, rgba(255,255,255,0.04), transparent 25%),
        linear-gradient(180deg, #1c2330 0%, #121822 55%, #0d1219 100%);
      cursor: crosshair;
    }

    .modeRow {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .normalBtn {
      background: linear-gradient(180deg, #45a8ff 0%, #2469d8 100%);
      box-shadow: 0 10px 24px rgba(36,105,216,.28);
    }

    .hellBtn {
      background: linear-gradient(180deg, #ff5a30 0%, #b61414 100%);
      box-shadow: 0 10px 24px rgba(182,20,20,.35);
    }

    .hellText {
      color: #ff765e;
      font-weight: 800;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.5);
      z-index: 10;
    }

    .panel {
      text-align: center;
      color: white;
      background: rgba(12, 18, 26, .92);
      border: 2px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 28px 24px;
      width: min(92vw, 520px);
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    .title {
      font-size: 42px;
      font-weight: 800;
      margin: 0 0 12px;
      letter-spacing: 1px;
      color: #fff7d6;
      text-shadow: 0 2px 8px rgba(255, 180, 50, .2);
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.5;
      color: #d3d9e3;
      margin: 0 0 18px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 18px;
      font-weight: 700;
      color: white;
      background: linear-gradient(180deg, #ff7b34 0%, #e8491d 100%);
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(232, 73, 29, .35);
    }

    button:hover {
      filter: brightness(1.06);
    }

    .hint {
      margin-top: 14px;
      font-size: 14px;
      color: #9fb0c4;
    }

    .fullscreen {
      position: fixed;
      right: 14px;
      top: 14px;
      z-index: 20;
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: none;
      font-size: 14px;
      padding: 10px 14px;
    }
  </style>
</head>
<body>
  <div id="gameFrame">
    <canvas id="game"></canvas>
  </div>

  <button class="fullscreen" id="fsBtn">⛶ Полный экран</button>

  <div class="overlay" id="startOverlay">
    <div class="panel">
      <div class="title">FRUIT NINJA</div>
      <p class="subtitle">
        Поле игры — <b>4:3</b>.<br>
        Выбери сложность:
      </p>
      <div class="modeRow">
        <button class="normalBtn" id="normalBtn">Обычная</button>
        <button class="hellBtn" id="hellBtn">АД</button>
      </div>
      <div class="hint"><span class="hellText">АД</span>: фруктов и бомб намного больше, но скорость всё равно ниже старой версии.</div>
    </div>
  </div>

  <div class="overlay" id="gameOverOverlay" style="display:none;">
    <div class="panel">
      <div class="title">Игра окончена</div>
      <p class="subtitle" id="finalStats">Счёт: 0</p>
      <div class="modeRow">
        <button id="restartBtn">Играть снова</button>
        <button class="normalBtn" id="menuBtn">Выбрать сложность</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalStats = document.getElementById('finalStats');
    const normalBtn = document.getElementById('normalBtn');
    const hellBtn = document.getElementById('hellBtn');
    const restartBtn = document.getElementById('restartBtn');
    const menuBtn = document.getElementById('menuBtn');
    const fsBtn = document.getElementById('fsBtn');

    let W = 0, H = 0, DPR = 1;
    let gameMode = 'normal';

    function resize() {
      DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      const rect = canvas.getBoundingClientRect();
      W = rect.width;
      H = rect.height;
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener('resize', resize);
    document.addEventListener('fullscreenchange', () => setTimeout(resize, 80));
    resize();

    const FRUITS = [
      { name: 'apple', color: '#ff4b4b', emoji: '🍎' },
      { name: 'orange', color: '#ff9d2e', emoji: '🍊' },
      { name: 'watermelon', color: '#4cc35c', emoji: '🍉' },
      { name: 'banana', color: '#ffd54f', emoji: '🍌' },
      { name: 'kiwi', color: '#7ec850', emoji: '🥝' },
      { name: 'peach', color: '#ff9a73', emoji: '🍑' },
      { name: 'strawberry', color: '#ff4d6d', emoji: '🍓' },
      { name: 'pineapple', color: '#e4c24a', emoji: '🍍' }
    ];

    let score = 0;
    let lives = 3;
    let running = false;
    let lastTime = 0;
    let spawnTimer = 0;
    let difficultyTimer = 0;
    let spawnInterval = 1100;
    let speedBoost = 0;

    const items = [];
    const particles = [];
    const slashPoints = [];

    let pointerDown = false;
    let pointerX = 0;
    let pointerY = 0;

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function distPointToSegment(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      if (dx === 0 && dy === 0) {
        const ddx = px - x1;
        const ddy = py - y1;
        return Math.sqrt(ddx * ddx + ddy * ddy);
      }
      const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy)));
      const nx = x1 + t * dx;
      const ny = y1 + t * dy;
      const ddx = px - nx;
      const ddy = py - ny;
      return Math.sqrt(ddx * ddx + ddy * ddy);
    }

    function resetGame() {
      score = 0;
      lives = gameMode === 'hell' ? 2 : 3;
      running = true;
      lastTime = 0;
      spawnTimer = 0;
      difficultyTimer = 0;
      spawnInterval = gameMode === 'hell' ? 520 : 1100;
      speedBoost = 0;
      items.length = 0;
      particles.length = 0;
      slashPoints.length = 0;
      gameOverOverlay.style.display = 'none';
    }

    function spawnItem() {
      const motionScale = Math.max(0.7, H / 720);
      const sizeScale = Math.max(0.8, Math.min(1.35, H / 720));

      // В обоих режимах скорость ниже исходной версии.
      // АД сложнее в первую очередь количеством фруктов и бомб.
      const hell = gameMode === 'hell';
      const bombChance = hell ? 0.26 : 0.12;
      const isBomb = Math.random() < bombChance;
      const radius = (isBomb ? rand(24, 30) : rand(26, 36)) * sizeScale;
      const sideMargin = Math.max(60, radius + 18);
      const x = rand(sideMargin, Math.max(sideMargin + 1, W - sideMargin));
      const y = H + radius + rand(0, 35) * sizeScale;
      const vx = rand(hell ? -150 : -115, hell ? 150 : 115) * motionScale;
      const baseVy = hell ? rand(620, 750) : rand(560, 680);
      const vy = -((baseVy + speedBoost) * motionScale);
      const gravity = (hell ? 600 : 520) * motionScale;
      const rot = rand(-3, 3);

      if (isBomb) {
        items.push({
          type: 'bomb',
          x, y, vx, vy, radius,
          gravity,
          sliced: false,
          rotation: 0,
          vr: rot,
          dead: false
        });
      } else {
        const fruit = FRUITS[(Math.random() * FRUITS.length) | 0];
        items.push({
          type: 'fruit',
          fruit,
          x, y, vx, vy, radius,
          gravity,
          sliced: false,
          rotation: rand(0, Math.PI * 2),
          vr: rot,
          dead: false
        });
      }
    }

    function createJuiceBurst(item) {
      const color = item.type === 'bomb' ? '#bfc7d5' : item.fruit.color;
      const count = item.type === 'bomb' ? 18 : 16;
      for (let i = 0; i < count; i++) {
        const a = rand(0, Math.PI * 2);
        const s = rand(80, 320);
        particles.push({
          x: item.x,
          y: item.y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: rand(0.35, 0.7),
          maxLife: 0,
          r: rand(3, 8),
          color
        });
      }
    }

    function explodeBomb() {
      for (let i = 0; i < 36; i++) {
        const a = rand(0, Math.PI * 2);
        const s = rand(80, 460);
        particles.push({
          x: W / 2,
          y: H / 2,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: rand(0.4, 0.9),
          maxLife: 0,
          r: rand(4, 10),
          color: i % 2 ? '#ff8a50' : '#ffe5a8'
        });
      }
    }

    function gameOver() {
      running = false;
      finalStats.innerHTML = `Счёт: <b>${score}</b>`;
      gameOverOverlay.style.display = 'flex';
    }

    function addSlashPoint(x, y) {
      slashPoints.push({ x, y, life: 0.22 });
      if (slashPoints.length > 20) slashPoints.shift();
    }

    function onPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      pointerX = p.clientX - rect.left;
      pointerY = p.clientY - rect.top;
      addSlashPoint(pointerX, pointerY);
    }

    canvas.addEventListener('mousedown', (e) => {
      pointerDown = true;
      onPointer(e);
    });
    window.addEventListener('mousemove', (e) => {
      if (!pointerDown) return;
      onPointer(e);
    });
    window.addEventListener('mouseup', () => pointerDown = false);

    canvas.addEventListener('touchstart', (e) => {
      pointerDown = true;
      onPointer(e);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!pointerDown) return;
      onPointer(e);
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchend', () => pointerDown = false);

    async function enterFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (e) {}
      setTimeout(resize, 120);
    }

    function startMode(mode) {
      gameMode = mode;
      startOverlay.style.display = 'none';
      resetGame();
      enterFullscreen();
    }

    normalBtn.addEventListener('click', () => startMode('normal'));
    hellBtn.addEventListener('click', () => startMode('hell'));

    restartBtn.addEventListener('click', () => {
      resetGame();
      enterFullscreen();
    });

    menuBtn.addEventListener('click', () => {
      running = false;
      gameOverOverlay.style.display = 'none';
      startOverlay.style.display = 'flex';
    });

    fsBtn.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (e) {}
    });

    function update(dt) {
      if (!running) return;

      spawnTimer += dt * 1000;
      difficultyTimer += dt * 1000;

      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;

        let count;
        if (gameMode === 'hell') {
          const r = Math.random();
          count = r < 0.18 ? 4 : (r < 0.58 ? 3 : 2);
        } else {
          count = Math.random() < 0.18 ? 2 : 1;
        }

        for (let i = 0; i < count; i++) spawnItem();
      }

      if (difficultyTimer > (gameMode === 'hell' ? 4200 : 6500)) {
        difficultyTimer = 0;

        if (gameMode === 'hell') {
          spawnInterval = Math.max(250, spawnInterval - 28);
          speedBoost += 7;
        } else {
          spawnInterval = Math.max(560, spawnInterval - 24);
          speedBoost += 5;
        }
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.vy += it.gravity * dt;
        it.x += it.vx * dt;
        it.y += it.vy * dt;
        it.rotation += it.vr * dt;

        if (!it.sliced && slashPoints.length >= 2) {
          for (let s = 1; s < slashPoints.length; s++) {
            const a = slashPoints[s - 1];
            const b = slashPoints[s];
            const d = distPointToSegment(it.x, it.y, a.x, a.y, b.x, b.y);
            if (d <= it.radius + 6) {
              it.sliced = true;
              createJuiceBurst(it);

              if (it.type === 'bomb') {
                explodeBomb();
                gameOver();
                return;
              } else {
                score += 1;
              }
              break;
            }
          }
        }

        if (!it.dead && it.y - it.radius > H + 40) {
          it.dead = true;
          if (it.type === 'fruit' && !it.sliced) {
            lives -= 1;
            if (lives <= 0) {
              gameOver();
              return;
            }
          }
        }

        if (it.dead || (it.sliced && it.y > H + 80)) {
          items.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vy += 540 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = slashPoints.length - 1; i >= 0; i--) {
        slashPoints[i].life -= dt;
        if (slashPoints[i].life <= 0) slashPoints.splice(i, 1);
      }
    }

    function drawBackgroundDecor() {
      for (let i = 0; i < 10; i++) {
        const y = 90 + i * 70;
        ctx.strokeStyle = 'rgba(255,255,255,0.025)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }
    }

    function drawFruit(it) {
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(it.rotation);

      if (it.type === 'bomb') {
        const r = it.radius;
        ctx.fillStyle = '#2c313a';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#79808c';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#505866';
        ctx.beginPath();
        ctx.arc(-r * 0.25, -r * 0.25, r * 0.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f5c44a';
        ctx.fillRect(-3, -r - 8, 6, 10);
        ctx.strokeStyle = '#f5c44a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -r - 8);
        ctx.quadraticCurveTo(10, -r - 20, 16, -r - 8);
        ctx.stroke();
      } else {
        const r = it.radius;
        ctx.fillStyle = it.fruit.color;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,.17)';
        ctx.beginPath();
        ctx.arc(-r * 0.28, -r * 0.25, r * 0.38, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(0,0,0,.18)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.strokeStyle = '#6a4a2a';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.7);
        ctx.lineTo(1, -r - 6);
        ctx.stroke();

        ctx.fillStyle = '#60b84c';
        ctx.beginPath();
        ctx.ellipse(r * 0.25, -r * 0.75, r * 0.28, r * 0.14, -0.6, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = `${Math.floor(r * 1.15)}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(it.fruit.emoji, 0, 1);
      }

      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        const alpha = Math.max(0, Math.min(1, p.life / 0.7));
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawSlash() {
      if (slashPoints.length < 2) return;

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let i = 1; i < slashPoints.length; i++) {
        const a = slashPoints[i - 1];
        const b = slashPoints[i];
        const t = i / slashPoints.length;
        ctx.strokeStyle = `rgba(255,255,255,${0.08 + t * 0.75})`;
        ctx.lineWidth = 4 + t * 10;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }

    function drawUI() {
      ctx.save();

      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.fillRect(14, 14, 220, 86);
      ctx.strokeStyle = 'rgba(255,255,255,.1)';
      ctx.strokeRect(14, 14, 220, 86);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 30px Arial';
      ctx.fillText(`Счёт: ${score}`, 28, 48);

      ctx.font = 'bold 24px Arial';
      ctx.fillStyle = '#ffd26f';
      ctx.fillText(`Жизни: ${'❤️'.repeat(lives)}`, 28, 82);

      ctx.font = 'bold 18px Arial';
      ctx.textAlign = 'right';
      ctx.fillStyle = gameMode === 'hell' ? '#ff6b52' : '#9bd0ff';
      ctx.fillText(gameMode === 'hell' ? '🔥 АД' : 'ОБЫЧНАЯ', W - 24, 40);
      ctx.textAlign = 'left';

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, W, H);

      drawBackgroundDecor();
      drawParticles();

      for (const it of items) {
        if (!it.sliced) drawFruit(it);
      }

      drawSlash();
      drawUI();
    }

    function loop(ts) {
      const t = ts || 0;
      const dt = Math.min(0.033, (t - lastTime) / 1000 || 0);
      lastTime = t;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
